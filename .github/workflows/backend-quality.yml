name: Backend quality

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "apps/api/**"
      - "packages/ai/**"
      - "packages/auth/**"
      - "packages/contracts/**"
      - "packages/database/**"
      - "packages/validation/**"
      - "pnpm-lock.yaml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: bookleaf_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d bookleaf_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/database generate
        env:
          DATABASE_URL: postgresql://integration:integration-password@localhost:5432/bookleaf_integration?schema=public
      - run: pnpm --filter @repo/api typecheck
      - run: pnpm --filter @repo/api lint
      - run: pnpm --filter @repo/api test
        env:
          DATABASE_URL: postgresql://integration:integration-password@localhost:5432/bookleaf_integration?schema=public
      - run: pnpm --filter @repo/api build
      - run: pnpm --filter @repo/database validate
        env:
          DATABASE_URL: postgresql://integration:integration-password@localhost:5432/bookleaf_integration?schema=public
      - run: pnpm --filter @repo/database migrate:deploy
        env:
          DATABASE_URL: postgresql://integration:integration-password@127.0.0.1:5432/bookleaf_integration?schema=public
      - run: pnpm test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://integration:integration-password@127.0.0.1:5432/bookleaf_integration?schema=public
          BETTER_AUTH_SECRET: integration-test-secret-at-least-32-chars
          BETTER_AUTH_URL: http://localhost:4000
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:4000
          WEB_ORIGIN: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000,http://localhost:4000
          API_CORS_ORIGIN: http://localhost:3000
