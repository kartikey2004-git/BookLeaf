name: Production deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit SHA or protected branch to deploy
        required: true
        default: master
        type: string

  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: bookleaf-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: postgresql://integration:integration-password@127.0.0.1:5432/bookleaf_integration?schema=public
      DIRECT_URL: postgresql://integration:integration-password@127.0.0.1:5432/bookleaf_integration?schema=public
      NODE_ENV: test
    services:
      postgres:
        image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: bookleaf_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d bookleaf_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/database generate
        env:
          DATABASE_URL: postgresql://integration:integration-password@127.0.0.1:5432/bookleaf_integration?schema=public
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://integration:integration-password@127.0.0.1:5432/bookleaf_integration?schema=public
          DIRECT_URL: postgresql://integration:integration-password@127.0.0.1:5432/bookleaf_integration?schema=public
      - run: pnpm --filter @repo/database validate
        env:
          DATABASE_URL: postgresql://integration:integration-password@127.0.0.1:5432/bookleaf_integration?schema=public
          DIRECT_URL: postgresql://integration:integration-password@127.0.0.1:5432/bookleaf_integration?schema=public
      - name: Run disposable database integration suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://integration:integration-password@127.0.0.1:5432/bookleaf_integration?schema=public
          BETTER_AUTH_SECRET: integration-test-secret-at-least-32-chars
          BETTER_AUTH_URL: http://localhost:4000
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:4000
          WEB_ORIGIN: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000,http://localhost:4000
        run: |
          pnpm --filter @repo/database migrate:deploy
          pnpm test:integration
      - name: Apply reviewed Prisma migrations once
        if: ${{ secrets.NEON_DIRECT_DATABASE_URL != '' }}
        env:
          DIRECT_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: pnpm --filter @repo/database migrate:deploy
      - name: Deploy the prepared Vercel frontend
        if: ${{ secrets.VERCEL_TOKEN != '' && vars.VERCEL_ORG_ID != '' && vars.VERCEL_PROJECT_ID != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          pnpm dlx vercel@65.11.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@65.11.0 build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@65.11.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
