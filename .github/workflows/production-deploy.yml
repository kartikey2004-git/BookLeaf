name: Production deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit SHA or protected branch to deploy
        required: true
        default: master
        type: string

  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: bookleaf-production
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}

jobs:
  deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: bookleaf_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d bookleaf_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-node@1e60f620b9541d8f8f2c3a9fca3e3b0a0bc2c1de # v4.0.3
        with:
          node-version: 26
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @repo/database validate
      - name: Run disposable database integration suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://integration:integration-password@127.0.0.1:5432/bookleaf_integration?schema=public
          BETTER_AUTH_SECRET: integration-test-secret-at-least-32-chars
          BETTER_AUTH_URL: http://localhost:4000
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:4000
          WEB_ORIGIN: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000,http://localhost:4000
        run: |
          pnpm --filter @repo/database migrate:deploy
          pnpm test:integration
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@1bee7de035d65ec5da40a31f8589e240eba8fde5 # v2.2.1
      - name: Validate release variables
        run: test -n "$PROJECT_ID" && test -n "$REGION" && test -n "$REPOSITORY"
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push immutable service images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile -t "$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/api:$IMAGE_TAG" .
          docker push "$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/api:$IMAGE_TAG"
      - name: Apply reviewed Prisma migrations once
        env:
          DIRECT_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: pnpm --filter @repo/database migrate:deploy
      - name: Deploy Cloud Run services
        env:
          IMAGE_TAG: ${{ github.sha }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
        run: |
          test -n "$WEB_ORIGIN"
          gcloud run deploy bookleaf-api --project="$PROJECT_ID" --region="$REGION" --image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/api:$IMAGE_TAG" --service-account="bookleaf-api@$PROJECT_ID.iam.gserviceaccount.com" --port=8080 --allow-unauthenticated --set-env-vars="NODE_ENV=production,API_HOST=0.0.0.0,WEB_ORIGIN=$WEB_ORIGIN,CORS_ORIGINS=$WEB_ORIGIN,BETTER_AUTH_URL=$WEB_ORIGIN,BETTER_AUTH_TRUSTED_ORIGINS=$WEB_ORIGIN,READINESS_CHECK_DATABASE=true" --set-secrets="DATABASE_URL=database-url:latest,BETTER_AUTH_SECRET=better-auth-secret:latest,INNGEST_EVENT_KEY=inngest-event-key:latest,INNGEST_SIGNING_KEY=inngest-signing-key:latest,GEMINI_API_KEY=gemini-api-key:latest"
      - name: Smoke-test live endpoints
        run: |
          API_URL="$(gcloud run services describe bookleaf-api --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          curl --fail --silent --show-error "$API_URL/api/v1/health/live"
      - name: Deploy the prepared Vercel frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          pnpm dlx vercel@65.11.0 pull --cwd apps/web --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@65.11.0 build --cwd apps/web --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@65.11.0 deploy --cwd apps/web --prebuilt --prod --yes --token="$VERCEL_TOKEN"
