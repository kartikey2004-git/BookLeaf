services:
  - type: web
    runtime: docker
    name: bookleaf-api
    repo: https://github.com/kartikey2004-git/BookLeaf.git
    branch: master
    region: singapore
    plan: starter
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: READINESS_CHECK_DATABASE
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TIMEOUT_MS
        value: "60000"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_TRUSTED_ORIGINS
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
